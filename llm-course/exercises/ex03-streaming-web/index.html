<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>AI 聊天</title>
    <style>
        /* 简单的聊天界面样式，可自行美化 */
        body { font-family: sans-serif; max-width: 700px; margin: 40px auto; }
        #messages { border: 1px solid #ddd; height: 400px; overflow-y: auto;
                    padding: 10px; border-radius: 8px; background: #fafafa; }
        .msg { margin: 8px 0; }
        .user { text-align: right; color: #1a73e8; }
        .assistant { white-space: pre-wrap; }
        #input-area { display: flex; gap: 8px; margin-top: 10px; }
        #question { flex: 1; padding: 8px; font-size: 14px; }
        button { padding: 8px 16px; }
    </style>
</head>
<body>
    <h2>🤖 AI 助手（逐字输出）</h2>
    <div id="messages"></div>
    <div id="input-area">
        <input id="question" placeholder="输入你的问题，回车发送" />
        <button onclick="send()">发送</button>
    </div>

    <script>
        async function send() {
            const input = document.getElementById("question");
            const question = input.value.trim();
            if (!question) return;
            input.value = "";

            // 把用户问题显示在界面上
            const msgBox = document.getElementById("messages");
            const userDiv = document.createElement("div");
            userDiv.className = "msg user";
            userDiv.textContent = question;
            msgBox.appendChild(userDiv);

            // 准备一个空的回答区域，后续逐字往里追加
            const assistantDiv = document.createElement("div");
            assistantDiv.className = "msg assistant";
            msgBox.appendChild(assistantDiv);

            // TODO-C3【核心】用 fetch 调 /chat 接口（POST + JSON body）
            //   然后读取返回的流（resp.body.getReader()）
            //   每读到一块，用 decoder.decode 转文本，
            //   去掉 "data:" 前缀和空行，把正文追加到 assistantDiv
            //   提示：
            //     const resp = await fetch("/chat", {method:"POST",
            //       headers:{"Content-Type":"application/json"},
            //       body: JSON.stringify({question})});
            //     const reader = resp.body.getReader();
            //     const decoder = new TextDecoder();
            //     while(true){ const {done,value}=await reader.read(); if(done)break;
            //       const text = decoder.decode(value);
            //       // 清洗：去 "data:" 前缀、去 \n、去空行
            //       assistantDiv.textContent += 清洗后的正文;
            //       滚动到底部 msgBox.scrollTop = msgBox.scrollHeight;
            //     }
            const resp = await fetch("/chat", {                       // ① 向 /chat 发请求
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({question: question}),           // 把问题序列化成 JSON
            });
            const reader = resp.body.getReader();                     // ② 拿到响应体的"流读取器"
            const decoder = new TextDecoder();                        // ③ 字节→中文的翻译器

            while (true) {
                const {done, value} = await reader.read();            // ④ 读一小块（可能一次收到好几条）
                if (done) break;                                      // 流结束了
                const text = decoder.decode(value);                   // ⑤ 字节翻译成文字

                text.split("\n").forEach(line => {                    // ⑥ 按行切开（可能一条含多块）
                    if (line.startsWith("data:")) {                   // ⑦ 只认 data: 开头的行
                        const content = line.slice(5);                // ⑧ 切掉 "data:" 这 5 个字符
                        if (content) {                                // 跳过空行
                            assistantDiv.textContent += content;      // ⑨ 追加进回答区 → 打字机！
                        }
                    }
                });
                msgBox.scrollTop = msgBox.scrollHeight;               // ⑩ 自动滚到底部
            }
        }

        // 回车发送
        document.getElementById("question").addEventListener("keydown", (e) => {
            if (e.key === "Enter") send();
        });
    </script>
</body>
</html>
